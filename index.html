<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fit-Track Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🏋️ Fit-Track Dashboard</h1>

  <div class="card">
    <h2>Steps</h2>
    <p id="steps">0</p>
    <button onclick="addSteps()">Add Steps</button>
  </div>

  <div class="card">
    <h2>Calories</h2>
    <p id="calories">0</p>
    <button onclick="addCalories()">Add Calories</button>
  </div>

  <div class="card">
    <h2>Water Intake</h2>
    <p id="water">0 L</p>
    <button onclick="addWater()">Drink Water</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
